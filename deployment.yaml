apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tech-challenge
  template:
    metadata:
      labels:
        app: tech-challenge
    spec:
      containers:
        - name: app
          image: kaonashiyume/tech-challenge:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080